<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp cưới</title>

  <script>
    // GitHub Pages gọi 404.html khi URL /g/MÃ không tồn tại.
    // Ta tải index.html nhưng giữ nguyên URL /g/MÃ trên thanh địa chỉ.
    fetch('/binhthaowedding/index.html')
      .then(response => {
        if (!response.ok) throw new Error('Không tải được index.html');
        return response.text();
      })
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Giữ đường dẫn tài nguyên tương đối của index.html
        const base = doc.createElement('base');
        base.href = '/binhthaowedding/';
        doc.head.prepend(base);

        document.open();
        document.write('<!DOCTYPE html>' + doc.documentElement.outerHTML);
        document.close();
      })
      .catch(error => {
        document.body.innerHTML =
          '<h2>Không thể mở thiệp cưới</h2>';
        console.error(error);
      });
  </script>
</head>

<body>
  <p>Đang mở thiệp...</p>
</body>
</html>
